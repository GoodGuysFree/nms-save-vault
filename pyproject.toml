[project]
name = "nms-save-vault"
version = "0.3.1"
description = "Safe backup, catalog, and slot management for No Man's Sky (PC: Steam and Xbox / Game Pass) save files."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
# Core is intentionally standard-library only (no compression dep needed: the app
# copies save data verbatim and only decrypts/re-encrypts the small meta files).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[project.scripts]
nmsvault-cli = "nms_save_vault.cli:main"
nmsvault = "nms_save_vault.cli:main"   # older name, kept for existing habits
nmsvault-gui = "nms_save_vault.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nms_save_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long checks (the real-data smoke test, the time budget); run with -m slow"]
